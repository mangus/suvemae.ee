<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Põgene sigade eest!</title>
  <meta name="description" content="3D-mäng, kus oled siil, korjad metsalagendikul õunu ja põgened näljaste sigade eest.">
  <link rel="stylesheet" href="stiil.css">
</head>
<body>
  <header>
    <a class="tagasi" href="../">← labor</a>
    <h1>Põgene sigade eest! 🦔🐷</h1>
  </header>
  <main>
    <div id="mang">
      <canvas id="vaade" width="800" height="450" aria-label="3D-mäng: siil põgeneb sigade eest"></canvas>
      <div id="info"><span id="ounad">🍎 0/10</span><span id="aeg">⏱ 0 s</span><span id="kerra">🦔 valmis</span></div>
      <div id="teade" class="nahtav">
        <h2 id="pealkiri">Sina oled siil! 🦔</h2>
        <p id="juhis">Korja 10 õuna ja ära lase sigadel end kätte saada. Kui siga tuleb liiga lähedale, keera end kerra: okkad lükkavad ta eemale!</p>
        <button id="alusta" type="button">Alusta mängu</button>
      </div>
      <div id="nupud" aria-label="Juhtnupud">
        <button type="button" data-key="left" aria-label="Pööra vasakule">↶</button>
        <button type="button" data-key="forward" aria-label="Jookse edasi">▲</button>
        <button type="button" data-key="right" aria-label="Pööra paremale">↷</button>
        <button type="button" data-key="back" aria-label="Astu tagasi">▼</button>
        <button type="button" data-key="curl" aria-label="Keera kerra">🦔</button>
      </div>
    </div>
    <p class="abi">Arvutis: <b>WASD</b> või nooleklahvid, <b>tühik</b> keerab siili kerra. Telefonis hoia nuppe all.</p>
  </main>
  <script type="module" src="mang.mjs"></script>
</body>
</html>
