<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Põgene sigade eest!</title>
  <meta name="description" content="3D põgenemismäng, kus pead metsarajal näljaste sigade eest ära jooksma.">
  <link rel="stylesheet" href="stiil.css">
</head>
<body>
  <header>
    <a class="tagasi" href="../">← labor</a>
    <h1>Põgene sigade eest! 🐷</h1>
  </header>
  <main>
    <div id="mang">
      <canvas id="vaade" width="800" height="450" aria-label="3D põgenemismäng"></canvas>
      <div id="info"><span id="aeg">Aeg: 0</span><span id="kaugus">Lähim siga: --</span></div>
      <div id="teade" class="nahtav">
        <h2 id="pealkiri">Ära lase sigadel end kätte saada!</h2>
        <p id="juhis">Liigu noolte või WASD-klahvidega. Telefonis kasuta nuppe. Pea vastu 45 sekundit!</p>
        <button id="alusta" type="button">Alusta mängu</button>
      </div>
      <div id="nupud" aria-label="Liikumisnupud">
        <button data-key="left" aria-label="Pööra vasakule">↶</button>
        <button data-key="forward" aria-label="Liigu edasi">▲</button>
        <button data-key="right" aria-label="Pööra paremale">↷</button>
        <button data-key="back" aria-label="Liigu tagasi">▼</button>
      </div>
    </div>
    <p class="abi">Arvutis: <b>WASD</b> või nooleklahvid. Telefonis hoia ekraaninuppu all.</p>
  </main>
  <script type="module" src="mang.mjs"></script>
</body>
</html>
